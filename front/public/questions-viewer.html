<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRE Question Bank Public Viewer & Interactive Selection Tester</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white font-bold text-xl shadow-lg">
          G
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-tight">GRE Question Bank Public Viewer</h1>
          <p class="text-xs text-slate-400">Interactive Question Renderer & Selection Limit Tester</p>
        </div>
      </div>

      <!-- Subject Tabs -->
      <div class="flex items-center bg-slate-900 p-1.5 rounded-xl border border-slate-800 gap-1" id="subject-tabs">
        <button onclick="setSubject('all')" id="tab-all" class="px-4 py-2 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm flex items-center gap-1.5">
          <span>All</span>
          <span id="cnt-all" class="bg-indigo-700/80 px-1.5 py-0.5 rounded text-[10px]">0</span>
        </button>
        <button onclick="setSubject('Verbal')" id="tab-Verbal" class="px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800 flex items-center gap-1.5">
          <span>Verbal</span>
          <span id="cnt-verbal" class="bg-slate-800 px-1.5 py-0.5 rounded text-[10px] text-slate-300">0</span>
        </button>
        <button onclick="setSubject('Quant')" id="tab-Quant" class="px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800 flex items-center gap-1.5">
          <span>Quantitative</span>
          <span id="cnt-quant" class="bg-slate-800 px-1.5 py-0.5 rounded text-[10px] text-slate-300">0</span>
        </button>
        <button onclick="setSubject('AWA')" id="tab-AWA" class="px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800 flex items-center gap-1.5">
          <span>AWA</span>
          <span id="cnt-awa" class="bg-slate-800 px-1.5 py-0.5 rounded text-[10px] text-slate-300">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Filter & Search Toolbar -->
  <section class="bg-slate-950/60 border-b border-slate-800/80 px-4 sm:px-6 lg:px-8 py-3">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2 text-xs">
        <!-- Category Filter -->
        <select id="filter-category" onchange="applyFilters()" class="bg-slate-900 border border-slate-800 text-slate-200 px-3 py-2 rounded-lg focus:outline-none focus:border-indigo-500">
          <option value="">All Categories</option>
        </select>

        <!-- Level Filter -->
        <select id="filter-level" onchange="applyFilters()" class="bg-slate-900 border border-slate-800 text-slate-200 px-3 py-2 rounded-lg focus:outline-none focus:border-indigo-500">
          <option value="">All Difficulty Levels</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>

        <!-- Question Type Filter -->
        <select id="filter-type" onchange="applyFilters()" class="bg-slate-900 border border-slate-800 text-slate-200 px-3 py-2 rounded-lg focus:outline-none focus:border-indigo-500">
          <option value="">All Question Types</option>
          <option value="MCQ">Multiple Choice (MCQ)</option>
          <option value="TEXT_COMPLETION">Text Completion</option>
          <option value="SENTENCE_EQUIVALENCE">Sentence Equivalence</option>
          <option value="QUANTITATIVE_COMPARISON">Quantitative Comparison</option>
          <option value="NUMERIC_ENTRY">Numeric Entry</option>
          <option value="MULTIPLE_CHOICE_MULTI">Multiple Choice (Multi-select)</option>
          <option value="AWA">Analytical Writing (AWA)</option>
        </select>
      </div>

      <!-- Search & Page Limits -->
      <div class="flex items-center gap-2">
        <div class="relative">
          <input type="text" id="search-input" placeholder="Search question text or ID..." onkeypress="if(event.key==='Enter') applyFilters()" class="bg-slate-900 border border-slate-800 text-slate-200 text-xs px-3 py-2 pl-8 rounded-lg w-48 sm:w-64 focus:outline-none focus:border-indigo-500">
          <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
        <button onclick="applyFilters()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow-sm">
          Filter
        </button>
      </div>
    </div>
  </section>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
    <!-- Toast Notification container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Status Bar -->
    <div class="flex items-center justify-between text-xs text-slate-400 mb-4 px-1">
      <span id="results-count">Loading questions...</span>
      <div class="flex items-center gap-2" id="pagination-controls">
        <button onclick="changePage(-1)" id="btn-prev" disabled class="px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed">Previous</button>
        <span id="page-indicator" class="font-medium text-slate-200">Page 1</span>
        <button onclick="changePage(1)" id="btn-next" disabled class="px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 disabled:opacity-40 disabled:cursor-not-allowed">Next</button>
      </div>
    </div>

    <!-- Questions List Container -->
    <div id="questions-list" class="space-y-6">
      <!-- Loading Skeleton -->
      <div class="bg-slate-950 border border-slate-800 rounded-2xl p-8 text-center text-slate-400 animate-pulse">
        Fetching questions from public API route...
      </div>
    </div>

    <!-- Bottom Pagination -->
    <div class="flex items-center justify-between text-xs text-slate-400 mt-8 pt-4 border-t border-slate-800">
      <span>GRE Question Bank Live Viewer</span>
      <div class="flex items-center gap-2">
        <button onclick="changePage(-1)" id="btn-prev-bottom" disabled class="px-4 py-2 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 disabled:opacity-40">Previous Page</button>
        <button onclick="changePage(1)" id="btn-next-bottom" disabled class="px-4 py-2 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 disabled:opacity-40">Next Page</button>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = "http://localhost:3500";
    let state = {
      subject: "all",
      category: "",
      level: "",
      question_type: "",
      search: "",
      page: 1,
      limit: 20,
      totalPages: 1,
      questions: [],
      selectedAnswers: {} // question_id -> selection state
    };

    document.addEventListener("DOMContentLoaded", () => {
      loadCategories();
      fetchQuestions();
    });

    function setSubject(subj) {
      state.subject = subj;
      state.page = 1;
      // Update tab styles
      ["all", "Verbal", "Quant", "AWA"].forEach(s => {
        const btn = document.getElementById("tab-" + s);
        if (s === subj) {
          btn.className = "px-4 py-2 rounded-lg text-xs font-semibold transition bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
        } else {
          btn.className = "px-4 py-2 rounded-lg text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800 flex items-center gap-1.5";
        }
      });
      loadCategories();
      fetchQuestions();
    }

    async function loadCategories() {
      try {
        const url = `${API_BASE}/api/public/categories${state.subject !== 'all' ? '?subject=' + state.subject : ''}`;
        const res = await fetch(url);
        const data = await res.json();
        const sel = document.getElementById("filter-category");
        sel.innerHTML = '<option value="">All Categories</option>';
        
        let cats = [];
        if (Array.isArray(data.categories)) {
          cats = data.categories;
        } else if (data.categories && typeof data.categories === 'object') {
          Object.values(data.categories).forEach(arr => {
            if (Array.isArray(arr)) cats.push(...arr);
          });
        }
        cats = [...new Set(cats)].sort();
        cats.forEach(c => {
          if (c) {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            sel.appendChild(opt);
          }
        });
      } catch (err) {
        console.error("Failed to load categories", err);
      }
    }

    function applyFilters() {
      state.category = document.getElementById("filter-category").value;
      state.level = document.getElementById("filter-level").value;
      state.question_type = document.getElementById("filter-type").value;
      state.search = document.getElementById("search-input").value.trim();
      state.page = 1;
      fetchQuestions();
    }

    function changePage(delta) {
      const newPage = state.page + delta;
      if (newPage >= 1 && newPage <= state.totalPages) {
        state.page = newPage;
        fetchQuestions();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    async function fetchQuestions() {
      const container = document.getElementById("questions-list");
      container.innerHTML = `
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-12 text-center text-slate-400">
          <div class="inline-block animate-spin w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full mb-3"></div>
          <p class="text-sm font-medium">Fetching active questions from backend...</p>
        </div>
      `;

      try {
        const params = new URLSearchParams({
          subject: state.subject,
          page: state.page,
          limit: state.limit
        });
        if (state.category) params.append("category", state.category);
        if (state.level) params.append("level", state.level);
        if (state.question_type) params.append("question_type", state.question_type);
        if (state.search) params.append("search", state.search);

        const res = await fetch(`${API_BASE}/api/public/questions?${params.toString()}`);
        const data = await res.json();

        state.questions = data.questions || [];
        state.totalPages = data.totalPages || 1;

        // Update counts header
        if (data.counts) {
          document.getElementById("cnt-all").textContent = data.counts.total || 0;
          document.getElementById("cnt-verbal").textContent = data.counts.Verbal || 0;
          document.getElementById("cnt-quant").textContent = data.counts.Quant || 0;
          document.getElementById("cnt-awa").textContent = data.counts.AWA || 0;
        }

        // Update status bar & pagination
        document.getElementById("results-count").textContent = `Showing ${state.questions.length} of ${data.total || 0} questions`;
        document.getElementById("page-indicator").textContent = `Page ${state.page} of ${state.totalPages}`;

        const isPrevDisabled = state.page <= 1;
        const isNextDisabled = state.page >= state.totalPages;

        ["btn-prev", "btn-prev-bottom"].forEach(id => document.getElementById(id).disabled = isPrevDisabled);
        ["btn-next", "btn-next-bottom"].forEach(id => document.getElementById(id).disabled = isNextDisabled);

        if (state.questions.length === 0) {
          container.innerHTML = `
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-12 text-center text-slate-400">
              <p class="text-base font-semibold text-slate-300">No questions found matching your filter criteria.</p>
              <p class="text-xs text-slate-500 mt-1">Try resetting filters or searching for a different keyword.</p>
            </div>
          `;
          return;
        }

        renderQuestionsList(container);

      } catch (err) {
        console.error("Error fetching questions:", err);
        container.innerHTML = `
          <div class="bg-red-950/40 border border-red-800/80 rounded-2xl p-8 text-center text-red-300">
            <p class="text-sm font-semibold">Failed to connect to backend server at ${API_BASE}.</p>
            <p class="text-xs text-red-400 mt-1">Make sure your Go backend server is running on port 3500.</p>
          </div>
        `;
      }
    }

    function renderQuestionsList(container) {
      container.innerHTML = "";
      state.questions.forEach((q, idx) => {
        const card = createQuestionCard(q, idx);
        container.appendChild(card);
      });
    }

    function createQuestionCard(q, index) {
      const card = document.createElement("div");
      card.className = "bg-slate-950 border border-slate-800/90 rounded-2xl p-6 sm:p-7 shadow-lg relative overflow-hidden transition hover:border-slate-700/80";

      const qt = (q.question_type || "").toUpperCase();
      const fmt = (q.answer_format || "").toUpperCase();
      const isAWA = q.subject === "AWA" || qt === "AWA" || fmt === "ESSAY";
      const isQC = qt === "QUANTITATIVE_COMPARISON";
      const isNumericEntry = qt === "NUMERIC_ENTRY" || qt === "FRACTION" || fmt === "NUMERIC_ENTRY";
      const isSE = qt === "SENTENCE_EQUIVALENCE";
      const isTC = qt === "TEXT_COMPLETION";

      // Maximum choices logic for selection restriction
      let maxChoices = 1;
      let isMulti = false;

      if (isSE) {
        maxChoices = 2; // Sentence Equivalence requires exactly 2 choices
        isMulti = true;
      } else if (isTC) {
        maxChoices = 1; // Handled per-blank
      } else if (isQC || isNumericEntry || isAWA) {
        maxChoices = 1;
      } else {
        // Check correct_answers count or is_multi_answer
        const correctCount = (q.correct_answers || []).length;
        if (q.is_multi_answer || qt === "MULTIPLE_CHOICE_MULTI" || qt === "SELECT_MANY" || fmt === "MULTI_CHOICE" || correctCount > 1) {
          isMulti = true;
          maxChoices = correctCount > 1 ? correctCount : (q.options ? q.options.length : 3);
        }
      }

      // Card Header Badges
      const headerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-5 border-b border-slate-800/80">
          <div class="flex flex-wrap items-center gap-2">
            <span class="bg-indigo-950/80 text-indigo-300 border border-indigo-800/60 px-3 py-1 rounded-full text-xs font-bold font-mono">
              ${q.question_id || 'Q' + (index + 1)}
            </span>
            <span class="bg-slate-900 text-slate-300 px-2.5 py-0.5 rounded-full text-xs font-medium border border-slate-800">
              ${q.subject || 'General'}
            </span>
            ${q.category ? `<span class="bg-slate-900/80 text-slate-400 px-2.5 py-0.5 rounded-full text-xs border border-slate-800">${q.category}</span>` : ''}
            ${q.level ? `<span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${q.level === 'Easy' ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : q.level === 'Hard' ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-amber-950 text-amber-300 border border-amber-800'}">${q.level}</span>` : ''}
          </div>

          <div class="flex items-center gap-2">
            ${isAWA ? `<span class="bg-purple-950 text-purple-300 border border-purple-800 px-2.5 py-1 rounded-lg text-xs font-semibold">Analytical Writing Essay</span>` : ''}
            ${isQC ? `<span class="bg-sky-950 text-sky-300 border border-sky-800 px-2.5 py-1 rounded-lg text-xs font-semibold">Quantitative Comparison</span>` : ''}
            ${isNumericEntry ? `<span class="bg-amber-950 text-amber-300 border border-amber-800 px-2.5 py-1 rounded-lg text-xs font-semibold">Numeric Entry Box</span>` : ''}
            ${isSE ? `<span class="bg-purple-950 text-purple-300 border border-purple-800 px-2.5 py-1 rounded-lg text-xs font-semibold">Sentence Equivalence (Select 2 Max)</span>` : ''}
            ${isTC ? `<span class="bg-teal-950 text-teal-300 border border-teal-800 px-2.5 py-1 rounded-lg text-xs font-semibold">Text Completion</span>` : ''}
            ${isMulti ? `<span class="bg-purple-950 text-purple-300 border border-purple-800 px-2.5 py-1 rounded-lg text-xs font-semibold">Select up to ${maxChoices} Answers</span>` : ''}
            ${!isAWA && !isQC && !isNumericEntry && !isSE && !isTC && !isMulti ? `<span class="bg-slate-900 text-slate-300 border border-slate-800 px-2.5 py-1 rounded-lg text-xs font-semibold">Single Choice (Pick 1)</span>` : ''}
          </div>
        </div>
      `;

      // Passage if present
      let passageHTML = '';
      if (q.passage) {
        passageHTML = `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 sm:p-5 mb-5 text-slate-300 text-sm leading-relaxed max-h-60 overflow-y-auto custom-scrollbar">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Reading Passage:</h4>
            ${q.passage.replace(/\n/g, '<br/>')}
          </div>
        `;
      }

      // Question Text
      const textHTML = `
        <div class="text-slate-100 font-medium text-base sm:text-lg leading-snug mb-5">
          ${(q.question_text || '').replace(/\n/g, '<br/>')}
        </div>
      `;

      // Question Images if present
      let imagesHTML = '';
      if (q.images && q.images.length > 0) {
        imagesHTML = `
          <div class="flex flex-wrap gap-4 mb-6">
            ${q.images.map(img => {
              const src = img.image_name || '';
              return `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 max-w-full">
                  <img src="${src}" alt="${img.caption || 'Question Image'}" class="max-h-64 rounded-lg object-contain bg-white" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'200\\' height=\\'100\\'><rect width=\\'200\\' height=\\'100\\' fill=\\'%231e293b\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%2394a3b8\\' text-anchor=\\'middle\\' dy=\\'.3em\\' font-size=\\'12\\'>[Diagram Image]</text></svg>';"/>
                  ${img.caption ? `<p class="text-xs text-slate-400 mt-1 text-center font-medium">${img.caption}</p>` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // Render Options & Input Controls
      let optionsContentHTML = '';

      if (isAWA) {
        optionsContentHTML = `
          <div class="space-y-3 bg-slate-900/60 p-4 rounded-xl border border-slate-800">
            <div class="flex items-center justify-between text-xs text-slate-400 font-semibold">
              <span>Write your essay response below:</span>
              <span id="word-count-${q._id}" class="text-indigo-400 bg-indigo-950 px-2.5 py-0.5 rounded border border-indigo-800">Word Count: 0 words</span>
            </div>
            <textarea rows="6" oninput="updateWordCount('${q._id}', this.value)" placeholder="Type your response here..." class="w-full p-4 rounded-xl border border-slate-700 bg-slate-900 text-slate-100 text-sm focus:border-indigo-500 focus:outline-none custom-scrollbar"></textarea>
          </div>
        `;
      } else if (isNumericEntry) {
        optionsContentHTML = `
          <div class="bg-slate-900/80 p-5 rounded-xl border border-slate-800 max-w-md">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Numeric Answer Entry:</label>
            <input type="text" placeholder="Enter numeric answer (e.g. 25 or 68.98)..." class="w-full p-3.5 rounded-lg border border-slate-700 bg-slate-900 text-slate-100 text-base font-semibold focus:border-indigo-500 focus:outline-none">
          </div>
        `;
      } else if (isTC && q.options && (q.options.length === 6 || q.options.length === 9)) {
        const optsPerBlank = 3;
        const blankCount = q.options.length / optsPerBlank;
        const blankNames = ["Blank (i)", "Blank (ii)", "Blank (iii)"];

        optionsContentHTML = `
          <div class="space-y-4">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Select 1 option per blank:</p>
            ${Array.from({ length: blankCount }).map((_, bIdx) => {
              const bOpts = q.options.slice(bIdx * optsPerBlank, (bIdx + 1) * optsPerBlank);
              return `
                <div class="bg-slate-900/80 border border-slate-800 rounded-xl p-4">
                  <h5 class="text-xs font-bold text-indigo-400 uppercase mb-3 flex items-center justify-between">
                    <span>${blankNames[bIdx] || 'Blank ' + (bIdx + 1)}</span>
                    <span class="text-[11px] text-slate-500 font-normal">Pick 1</span>
                  </h5>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    ${bOpts.map(opt => `
                      <button onclick="selectBlankOption('${q._id}', ${bIdx}, '${opt.label}')" id="btn-blank-${q._id}-${bIdx}-${opt.label}" class="p-3 text-left border border-slate-800 rounded-lg bg-slate-950 hover:border-indigo-500 text-slate-200 text-xs font-medium transition flex items-start gap-2">
                        <span class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[10px] font-bold text-slate-300 flex-shrink-0 mt-0.5">${opt.label}</span>
                        <span class="leading-tight">${opt.text || ('Option ' + opt.label)}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        // Standard MCQ / QC / SE / Multi-Answer
        const defaultQCOpts = [
          { label: "A", text: "Quantity A is greater." },
          { label: "B", text: "Quantity B is greater." },
          { label: "C", text: "The two quantities are equal." },
          { label: "D", text: "The relationship cannot be determined from the information given." }
        ];

        const displayOpts = isQC ? defaultQCOpts : (q.options || []);

        optionsContentHTML = `
          <div class="space-y-2.5">
            <div class="flex items-center justify-between text-xs text-slate-400 font-medium mb-1">
              <span>${isMulti || isSE ? `Selection Limit: Max ${maxChoices} choices` : 'Select 1 Answer'}</span>
              <span id="selected-counter-${q._id}" class="font-mono text-indigo-400">Selected: 0/${maxChoices}</span>
            </div>
            ${displayOpts.map(opt => `
              <button onclick="handleOptionClick('${q._id}', '${opt.label}', ${maxChoices}, ${isMulti || isSE})" id="btn-opt-${q._id}-${opt.label}" class="w-full text-left p-3.5 sm:p-4 border border-slate-800 bg-slate-900/60 hover:bg-slate-900 hover:border-slate-700 transition flex items-start gap-3 ${isMulti || isSE ? 'rounded-xl' : 'rounded-full'}">
                <span id="badge-opt-${q._id}-${opt.label}" class="w-6 h-6 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5 border ${isMulti || isSE ? 'rounded-md bg-slate-900 border-slate-700 text-slate-400' : 'rounded-full bg-slate-900 border-slate-700 text-slate-400'}">
                  ${opt.label}
                </span>
                <div class="flex-1 text-slate-200 text-sm font-medium leading-snug pt-0.5">
                  ${opt.text || ('Option ' + opt.label)}
                </div>
              </button>
            `).join('')}
          </div>
        `;
      }

      // Verification / Solution Toggle Section
      const answersList = (q.correct_answers || []).map(a => a.value || a.option_label).join(', ');
      const explanationText = q.explanation || 'No detailed explanation provided.';

      const verificationHTML = `
        <div class="mt-6 pt-4 border-t border-slate-800/80 flex flex-col gap-3">
          <button onclick="toggleExplanation('${q._id}')" class="self-start text-xs font-semibold text-indigo-400 hover:text-indigo-300 flex items-center gap-1.5 transition bg-indigo-950/40 px-3 py-1.5 rounded-lg border border-indigo-900/60">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <span>Reveal Correct Answer & Solution Verification</span>
          </button>
          
          <div id="exp-box-${q._id}" class="hidden bg-slate-900 border border-indigo-900/50 rounded-xl p-4 text-xs space-y-2">
            <div class="flex items-center gap-2 text-emerald-400 font-bold">
              <span>Correct Answer(s):</span>
              <span class="bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800 font-mono text-sm">${answersList || 'N/A'}</span>
            </div>
            <div class="text-slate-300 leading-relaxed pt-1">
              <span class="font-semibold text-slate-400 block mb-0.5">Explanation:</span>
              ${explanationText.replace(/\n/g, '<br/>')}
            </div>
          </div>
        </div>
      `;

      card.innerHTML = headerHTML + passageHTML + textHTML + imagesHTML + optionsContentHTML + verificationHTML;
      return card;
    }

    // Selection Control Logic (Enforces Selection Limit Rules!)
    function handleOptionClick(qid, label, maxChoices, isMulti) {
      if (!state.selectedAnswers[qid]) {
        state.selectedAnswers[qid] = [];
      }

      let selected = state.selectedAnswers[qid];

      if (!isMulti) {
        // Single choice: pick 1
        state.selectedAnswers[qid] = [label];
      } else {
        // Multi choice: enforce MAX choices constraint!
        if (selected.includes(label)) {
          // Deselect
          state.selectedAnswers[qid] = selected.filter(l => l !== label);
        } else {
          // Check limit!
          if (selected.length >= maxChoices) {
            showToast(`Maximum ${maxChoices} selections allowed for this question!`, "warning");
            return;
          }
          state.selectedAnswers[qid].push(label);
        }
      }

      // Update UI styles
      updateOptionUI(qid, maxChoices, isMulti);
    }

    function selectBlankOption(qid, bIdx, label) {
      if (!state.selectedAnswers[qid]) {
        state.selectedAnswers[qid] = {};
      }
      state.selectedAnswers[qid][bIdx] = label;

      // Update UI for blank buttons
      [0, 1, 2].forEach(optLabelChar => {
        const char = String.fromCharCode(65 + bIdx * 3 + optLabelChar); // A,B,C or D,E,F or G,H,I
        const btn = document.getElementById(`btn-blank-${qid}-${bIdx}-${char}`);
        if (btn) {
          if (char === label) {
            btn.className = "p-3 text-left border-2 border-indigo-500 rounded-lg bg-indigo-600 text-white text-xs font-semibold shadow-sm transition flex items-start gap-2";
          } else {
            btn.className = "p-3 text-left border border-slate-800 rounded-lg bg-slate-950 hover:border-indigo-500 text-slate-200 text-xs font-medium transition flex items-start gap-2";
          }
        }
      });
    }

    function updateOptionUI(qid, maxChoices, isMulti) {
      const selected = state.selectedAnswers[qid] || [];
      
      // Update selected counter text
      const counterEl = document.getElementById(`selected-counter-${qid}`);
      if (counterEl) {
        counterEl.textContent = `Selected: ${selected.length}/${maxChoices}`;
        if (selected.length === maxChoices) {
          counterEl.className = "font-mono text-emerald-400 font-bold";
        } else {
          counterEl.className = "font-mono text-indigo-400";
        }
      }

      // Iterate through options
      const q = state.questions.find(item => item._id === qid);
      if (!q) return;

      const opts = q.options && q.options.length > 0 ? q.options : [
        { label: "A" }, { label: "B" }, { label: "C" }, { label: "D" }
      ];

      opts.forEach(opt => {
        const btn = document.getElementById(`btn-opt-${qid}-${opt.label}`);
        const badge = document.getElementById(`badge-opt-${qid}-${opt.label}`);
        if (!btn || !badge) return;

        const isSelected = selected.includes(opt.label);

        if (isSelected) {
          btn.className = `w-full text-left p-3.5 sm:p-4 border-2 border-indigo-500 bg-indigo-950/60 transition flex items-start gap-3 shadow-md ${isMulti ? 'rounded-xl' : 'rounded-full'}`;
          badge.className = `w-6 h-6 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5 border border-indigo-400 bg-indigo-600 text-white ${isMulti ? 'rounded-md' : 'rounded-full'}`;
        } else {
          btn.className = `w-full text-left p-3.5 sm:p-4 border border-slate-800 bg-slate-900/60 hover:bg-slate-900 hover:border-slate-700 transition flex items-start gap-3 ${isMulti ? 'rounded-xl' : 'rounded-full'}`;
          badge.className = `w-6 h-6 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5 border border-slate-700 bg-slate-900 text-slate-400 ${isMulti ? 'rounded-md' : 'rounded-full'}`;
        }
      });
    }

    function toggleExplanation(qid) {
      const box = document.getElementById(`exp-box-${qid}`);
      if (box) {
        box.classList.toggle("hidden");
      }
    }

    function updateWordCount(qid, text) {
      const words = text.trim() ? (text.trim().match(/\S+/g) || []).length : 0;
      const cntEl = document.getElementById(`word-count-${qid}`);
      if (cntEl) {
        cntEl.textContent = `Word Count: ${words} words`;
      }
    }

    function showToast(msg, type = "info") {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = `px-4 py-3 rounded-xl border text-xs font-semibold shadow-2xl transition transform duration-300 translate-y-2 pointer-events-auto flex items-center gap-2 ${type === 'warning' ? 'bg-amber-950 border-amber-800 text-amber-200' : 'bg-indigo-950 border-indigo-800 text-indigo-200'}`;
      toast.innerHTML = `
        <svg class="w-4 h-4 text-amber-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        <span>${msg}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }
  </script>
</body>
</html>
